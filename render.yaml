services:
  - type: web
    name: teamtrack-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:packages && npm run --workspace=@teamtrack/backend build
    startCommand: node services/backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
