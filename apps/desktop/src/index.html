<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamTrack Desktop</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 500px;
    }
    h1 {
      margin: 0 0 1rem 0;
      font-size: 2rem;
      color: #60a5fa;
    }
    p {
      color: #94a3b8;
      margin: 0 0 1.5rem 0;
      font-size: 1rem;
    }
    .badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 9999px;
      color: #4ade80;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TeamTrack</h1>
    <p>Phase 13: Administration, Governance & User Security Management Active</p>
    <div class="badge" style="background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3); color: #60a5fa;">🛡️ Enterprise Governance & Security</div>
    <div style="margin-top: 12px; font-size: 0.8rem; color: #94A3B8;">
      Zero Direct Database Access • Sandboxed Renderer • Server-Side Authorization Boundary
    </div>
  </div>
</body>
</html>
