<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
  />
  <title>Microsoft Teams — TeamTrack</title>
  <link rel="stylesheet" href="./desktop.css" />
</head>
<body>
  <!-- ============================================================
       TEAMS WINDOW TITLEBAR (48px Header & Drag Region)
       ============================================================ -->
  <div id="titlebar">
    <div id="titlebar-logo">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tt-bg-grad-off" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#4338CA" />
            <stop offset="45%" stopColor="#5B5FC7" />
            <stop offset="100%" stopColor="#7B83EB" />
          </linearGradient>
          <linearGradient id="tt-track-grad-off" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#38BDF8" />
            <stop offset="50%" stopColor="#818CF8" />
            <stop offset="100%" stopColor="#C084FC" />
          </linearGradient>
          <linearGradient id="tt-t-grad-off" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#FFFFFF" />
            <stop offset="100%" stopColor="#EEF2FF" />
          </linearGradient>
        </defs>
        <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#tt-bg-grad-off)" />
        <rect x="2" y="2" width="28" height="28" rx="7.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" fill="none" />
        <path d="M10 24C6.5 21.5 5.5 16.5 7.5 12C9.5 7.5 14.5 5 19 6.5C20.5 7 21.5 7.8 22.5 8.8" stroke="url(#tt-track-grad-off)" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
        <path d="M20.5 22.5L24.5 18.5L20.5 14.5" stroke="url(#tt-track-grad-off)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
        <path d="M9 10C9 9.45 9.45 9 10 9H20C20.55 9 21 9.45 21 10C21 10.55 20.55 11 20 11H16.2V21C16.2 21.55 15.75 22 15.2 22C14.65 22 14.2 21.55 14.2 21V11H10C9.45 11 9 10.55 9 10Z" fill="url(#tt-t-grad-off)" />
        <circle cx="23.5" cy="8.5" r="1.8" fill="#38BDF8" />
      </svg>
      <span id="titlebar-title">TeamTrack — Microsoft Teams</span>
    </div>

    <div id="header-search-wrap" style="-webkit-app-region: no-drag;">
      <div id="header-search">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <input type="text" id="global-search-input" placeholder="Search (Ctrl+E)" />
        <kbd class="search-kbd">Ctrl+E</kbd>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:8px; -webkit-app-region:no-drag; height: 48px;">
      <!-- Profile Avatar -->
      <div id="avatar-btn" title="Alex Morgan (Available)">
        <div id="avatar-img">AM</div>
        <div id="avatar-status"></div>
      </div>

      <!-- Window Control Buttons -->
      <div id="titlebar-controls">
        <button class="titlebar-btn" id="btn-minimize" title="Minimize">
          <svg viewBox="0 0 10 1" width="10" height="1">
            <rect width="10" height="1" fill="currentColor" />
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-maximize" title="Maximize">
          <svg viewBox="0 0 10 10" width="10" height="10">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button class="titlebar-btn close" id="btn-close" title="Close">
          <svg viewBox="0 0 10 10" width="10" height="10">
            <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2" />
            <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       APP SHELL & WORKSPACE
       ============================================================ -->
  <div id="app-shell">
    <div id="workspace">
      <!-- LEFT APP RAIL -->
      <div id="app-rail">
        <button class="rail-logo-btn" id="sidebar-toggle" title="Toggle Navigation">
          <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20" style="color:var(--brand);">
            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
          </svg>
        </button>

        <div class="rail-nav">
          <!-- 1. Activity -->
          <div class="rail-item tooltip" data-tab="activity" data-tip="Activity">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <div class="rail-badge">3</div>
          </div>

          <!-- 2. Chat (Active default) -->
          <div class="rail-item active tooltip" data-tab="chat" data-tip="Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <div class="rail-badge">1</div>
          </div>

          <!-- 3. Teams -->
          <div class="rail-item tooltip" data-tab="teams" data-tip="Teams">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>

          <!-- 4. Calendar -->
          <div class="rail-item tooltip" data-tab="calendar" data-tip="Calendar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>

          <!-- 5. Calls -->
          <div class="rail-item tooltip" data-tab="calls" data-tip="Calls">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>

          <!-- 6. OneDrive / Files -->
          <div class="rail-item tooltip" data-tab="files" data-tip="OneDrive / Files">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
              <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
          </div>

          <!-- 7. Copilot -->
          <div class="rail-item tooltip" data-tab="copilot" data-tip="Copilot">
            <span style="font-size:18px;">✨</span>
          </div>

          <!-- Spacer -->
          <div style="flex:1;"></div>

          <!-- 8. Settings -->
          <div class="rail-item tooltip" data-tab="settings" data-tip="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- SECONDARY SIDEBAR -->
      <div id="sidebar"></div>

      <!-- MAIN STAGE -->
      <div id="stage"></div>
    </div>
  </div>

  <!-- ============================================================
       PROFILE & PRESENCE STATUS POPOVER
       ============================================================ -->
  <div class="user-menu-overlay hidden" id="user-menu-overlay"></div>
  <div class="user-menu-popover hidden" id="user-menu">
    <div class="user-menu-header">
      <div class="user-menu-avatar">AM</div>
      <div>
        <div class="user-menu-name">Alex Morgan</div>
        <div class="user-menu-email">alex.morgan@teamtrack.enterprise</div>
      </div>
    </div>
    <div style="padding: 6px 0;">
      <div style="font-size:11px; font-weight:700; color:var(--text-tertiary); padding:4px 16px; text-transform:uppercase;">
        Set Presence
      </div>
      <div class="user-menu-item status-picker-option" data-status="available">
        <span style="color:#92C353; font-size:16px;">●</span> Available
      </div>
      <div class="user-menu-item status-picker-option" data-status="busy">
        <span style="color:#C4314B; font-size:16px;">●</span> Busy
      </div>
      <div class="user-menu-item status-picker-option" data-status="away">
        <span style="color:#F8D22A; font-size:16px;">●</span> Away
      </div>
      <div class="user-menu-item status-picker-option" data-status="offline">
        <span style="color:#8A8886; font-size:16px;">●</span> Appear Offline
      </div>
    </div>
    <div class="user-menu-divider"></div>
    <div class="user-menu-item" id="menu-toggle-dark-mode">
      <span>🌓</span> Toggle Dark Theme
    </div>
    <div class="user-menu-item" onclick="window.switchTab('settings')">
      <span>⚙️</span> Manage Account
    </div>
    <div class="user-menu-divider"></div>
    <div class="user-menu-item danger" onclick="alert('Signed out.');">
      <span>🚪</span> Sign out
    </div>
  </div>

  <!-- Client Application Logic -->
  <script src="./desktop.js"></script>

  <!-- Auto-redirect to live Next.js Teams application if running on port 3000 -->
  <script>
    (function checkLiveTeamsServer() {
      fetch('http://localhost:3000', { mode: 'no-cors' })
        .then(() => {
          window.location.href = 'http://localhost:3000';
        })
        .catch(() => {
          setTimeout(checkLiveTeamsServer, 2000);
        });
    })();
  </script>
</body>
</html>
