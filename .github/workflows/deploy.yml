name: TeamTrack CD (Auto-Deploy to Live Server)

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    if: ${{ secrets.PROD_SERVER_HOST != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Live Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER || 'root' }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [Deploy] Starting automated zero-downtime deployment for TeamTrack..."
            cd /opt/teamtrack || cd ~/teamtrack
            
            # Fetch latest git commits
            git fetch --all
            git reset --hard origin/main
            
            # Run production update script
            chmod +x deploy/*.sh
            ./deploy/update.sh
            
            echo "✅ [Deploy] TeamTrack production deployment completed successfully!"
