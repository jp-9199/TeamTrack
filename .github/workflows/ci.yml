name: TeamTrack CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamtrack
          POSTGRES_PASSWORD: teamtrack_test_password
          POSTGRES_DB: teamtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Build Backend
        run: npm run --workspace=@teamtrack/backend build

      - name: Run Database Migrations
        run: npm run --workspace=@teamtrack/backend migrate:dev
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://teamtrack:teamtrack_test_password@localhost:5432/teamtrack_test

      - name: Run Backend Tests
        run: npm run --workspace=@teamtrack/backend test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://teamtrack:teamtrack_test_password@localhost:5432/teamtrack_test
          REDIS_URL: redis://localhost:6379

      - name: Build Web Application
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
