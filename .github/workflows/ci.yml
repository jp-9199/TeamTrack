name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify (Typecheck & Test)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck (All Workspaces)
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

      - name: Build Packages & Apps
        run: npm run build

  docker-verify:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: verify
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -f infrastructure/backend.Dockerfile .

      - name: Build Web Image
        run: docker build -f infrastructure/web.Dockerfile .
