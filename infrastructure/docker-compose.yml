version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: teamtrack_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      - CADDY_ENVIRONMENT=${CADDY_ENVIRONMENT:-local}
    depends_on:
      - web
      - backend
    networks:
      - teamtrack_network

  postgres:
    image: postgres:16-alpine
    container_name: teamtrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teamtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teamtrack_local_secret}
      POSTGRES_DB: ${DB_NAME:-teamtrack_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose locally for debugging/migration outside compose if needed
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teamtrack} -d ${DB_NAME:-teamtrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - teamtrack_network

  redis:
    image: redis:7-alpine
    container_name: teamtrack_redis
    restart: unless-stopped
    # Enable AOF persistence for resilience across restarts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - teamtrack_network

  backend:
    build:
      context: ../
      dockerfile: infrastructure/backend.Dockerfile
    container_name: teamtrack_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${DB_USER:-teamtrack}:${DB_PASSWORD:-teamtrack_local_secret}@postgres:5432/${DB_NAME:-teamtrack_db}
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-super-secure-production-key-that-is-long-enough-for-production}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-super-secure-production-refresh-key-that-is-long-enough-for-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-mock} # Replace with S3 in real production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - teamtrack_network

  web:
    build:
      context: ../
      dockerfile: infrastructure/web.Dockerfile
    container_name: teamtrack_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://localhost/ws}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - teamtrack_network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  teamtrack_network:
    driver: bridge
